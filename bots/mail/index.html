<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Bots · Mail log — Ostroff.LA</title>
<style>
  :root {
    --bg: #111214; --panel: #1a1c20; --panel2: #22252b; --line: #2c3038;
    --text: #ececec; --muted: #9aa0aa; --accent: #d4a24a; --on: #5dba7a; --off: #8a8f98;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  body { padding: 24px 18px 64px; max-width: 1180px; margin: 0 auto; }
  a { color: var(--accent); text-decoration: none; }
  .admin-bar {
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
    margin: -4px 0 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line);
    font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  }
  .admin-bar a { color: var(--muted); }
  .admin-bar a.on { color: var(--text); }
  .admin-bar form { margin: 0 0 0 auto; }
  .admin-bar button {
    font: inherit; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    min-height: 0; padding: 6px 10px; border-radius: 8px; color: var(--text);
  }
  .kicker { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 6px 0 4px; font-size: 28px; font-weight: 650; }
  .sub { color: var(--muted); margin-bottom: 16px; }
  .sample { display: inline-block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent); border: 1px solid #5a4a28; background: #2a2418; padding: 2px 8px;
    border-radius: 99px; margin-left: 8px; }
  .stats { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pills.secondary { margin-bottom: 16px; }
  .pills button { font: inherit; font-size: 14px; font-weight: 600; border-radius: 999px;
    padding: 10px 14px; min-height: 44px; border: 1px solid var(--line); background: var(--panel2); color: var(--muted); }
  .pills button.on { color: var(--text); border-color: #4a5060; background: #2a2e36; }
  .pills.inbox button.on { color: #1a1408; background: var(--accent); border-color: var(--accent); }
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; min-width: 960px; }
  th, td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; background: var(--panel2); font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); font-weight: 650; }
  th button {
    font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit;
    background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
  }
  th button:hover, th[aria-sort] button { color: var(--text); }
  th[aria-sort="descending"] button::after { content: "↓"; color: var(--accent); }
  th[aria-sort="ascending"] button::after { content: "↑"; color: var(--accent); }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #1e2127; }
  .date { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  .from { font-weight: 650; max-width: 16em; }
  .subj { max-width: 22em; }
  .labels { max-width: 18em; }
  .label-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .gmail-label { color: var(--accent); font-size: 12px; letter-spacing: .02em; word-break: break-word; }
  .rule-id { color: var(--muted); font-size: 11px; margin-top: 4px; word-break: break-word; }
  .act { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .act.keep { background: #1e3326; color: var(--on); }
  .act.archive { background: #2a2a2a; color: var(--off); }
  .note-cell { min-width: 16em; }
  .note-form { display: flex; gap: 6px; align-items: center; }
  .note-form input {
    flex: 1; min-width: 0; min-height: 36px; font: inherit; color: var(--text);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
  }
  .note-form button {
    font: inherit; font-size: 13px; font-weight: 600; min-height: 36px; padding: 6px 10px;
    border-radius: 8px; color: #1a1408; background: var(--accent); border: 1px solid var(--accent); white-space: nowrap;
  }
  .note-form button:disabled { opacity: .6; }
  .note-form button.clear {
    color: var(--text); background: var(--panel2); border-color: var(--line);
  }
  .note-form .status { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .note-form .status.applied { font-style: italic; }
  .empty { padding: 18px 16px; color: var(--muted); }
</style>
</head>
<body>
  <div class="admin-bar">
    <a href="/">Home</a>
    <a href="/trips/">Trips</a>
    <a href="/tickets/">Tickets</a>
    <a href="/bots/">Briefing</a>
    <a href="/bots/mail/" class="on">Mail log</a>
    <form method="post" action="/api/logout"><button type="submit">Sign out</button></form>
  </div>
  <div class="kicker"><a href="/bots/">Briefing</a> · Cliff<span class="sample" data-sample>Live</span></div>
  <h1>Mail log</h1>
  <p class="sub">What Cliff filed, and the Gmail labels he assigned. Leave a note if the filing should change. No bodies. Newest first — click a column to sort.</p>
  <div class="stats" data-stats>Loading…</div>
  <div class="pills inbox" id="inboxes" aria-label="Inbox"></div>
  <div class="pills secondary" id="pills" aria-label="Keep or archive"></div>
  <div id="list"></div>
<script>
let DATA = { rows: [], corrs: [], boxes: [], notes: [] };
let INBOX = "ostroff";
let ACTION = "all";
let SORT = { col: "date", dir: "desc" };
const DRAFTS = {};

const INBOXES = [
  { id: "ostroff", label: "ostroff.la" },
  { id: "pixelocity", label: "Pixelocity" }
];
const COLS = [
  ["date", "Date"],
  ["from", "From"],
  ["subject", "Subject"],
  ["action", "Keep / archive"],
  ["labels", "Labels"],
  ["note", "Note"]
];

function bootMail() {
  fetch("/api/morning-mail", { credentials: "include", cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
    .then(d => {
      DATA = d;
      DATA.rows = DATA.rows || [];
      DATA.corrs = DATA.corrs || [];
      DATA.notes = DATA.notes || [];
      if (!DATA.rows.some(r => r.account === INBOX) && DATA.rows.some(r => r.account === "pixelocity")) {
        INBOX = "pixelocity";
      }
      render();
    })
    .catch(() => {
      const el = document.getElementById("list");
      if (el) el.innerHTML = '<div class="empty">Mail log is not loaded yet.</div>';
      document.querySelector("[data-stats]").textContent = "Mail log is not loaded yet.";
    });
}

function arrivalMs(r) {
  const t = Date.parse(r && r.date ? r.date : "");
  return Number.isNaN(t) ? null : t;
}

function noteProcessed(n) {
  if (!n || typeof n !== "object") return false;
  const flag = n.processed ?? n.cleared ?? n.applied;
  if (flag === true || flag === 1 || flag === "1") return true;
  if (typeof flag === "string" && /^(true|yes|processed|cleared|applied)$/i.test(flag.trim())) return true;
  const status = String(n.status || "").toLowerCase();
  return status === "processed" || status === "cleared" || status === "applied";
}

function savedNotes(r) {
  const k = r.key || [r.account || "", r.date || "", r.from || "", r.subject || ""].join("\t");
  const stored = (r.notes && r.notes.length)
    ? r.notes
    : (DATA.notes || []).filter(n => (n.key || "") === k);
  return stored.filter(n => String(n.note || "").trim());
}

function openSavedNotes(r) {
  return savedNotes(r).filter(n => !noteProcessed(n));
}

function rowNotes(r) {
  const stored = savedNotes(r);
  const corrs = (DATA.corrs || []).filter(c =>
    c.from === r.from && c.subject === r.subject &&
    (!c.account || !r.account || c.account === r.account)
  ).map(c => ({
    note: c.note || [c.cliff && `Cliff ${c.cliff}`, c.nick && `Nick ${c.nick}`].filter(Boolean).join(" → "),
    by: "nick",
    at: ""
  }));
  const seen = new Set();
  const out = [];
  for (const n of corrs.concat(stored)) {
    const text = String(n.note || "").trim();
    if (!text || seen.has(text)) continue;
    seen.add(text);
    out.push(n);
  }
  return out;
}

function latestNote(r) {
  const open = openSavedNotes(r);
  if (open.length) return open[open.length - 1].note;
  if (savedNotes(r).some(noteProcessed)) return "";
  const notes = rowNotes(r).filter(n => !noteProcessed(n));
  return notes.length ? notes[notes.length - 1].note : "";
}

function sortRows(rows) {
  const { col, dir } = SORT;
  const mul = dir === "asc" ? 1 : -1;
  return rows.slice().sort((a, b) => {
    if (col === "date") {
      const da = arrivalMs(a);
      const db = arrivalMs(b);
      if (da == null && db == null) return 0;
      if (da == null) return 1;
      if (db == null) return -1;
      if (da !== db) return (da - db) * mul;
    } else {
      const va = col === "note" ? latestNote(a) : String(a[col] || "");
      const vb = col === "note" ? latestNote(b) : String(b[col] || "");
      const c = va.localeCompare(vb, undefined, { sensitivity: "base" });
      if (c) return c * mul;
      const da = arrivalMs(a);
      const db = arrivalMs(b);
      if (da != null && db != null && da !== db) return db - da;
    }
    return String(a.subject || "").localeCompare(String(b.subject || ""));
  });
}

function inboxRows() {
  return sortRows(DATA.rows.filter(r => r.account === INBOX));
}

function visibleRows() {
  const rows = inboxRows();
  if (ACTION === "keep" || ACTION === "archive") return rows.filter(r => r.action === ACTION);
  if (ACTION === "notes") return rows.filter(r => openSavedNotes(r).length);
  return rows;
}

function pills() {
  const boxCounts = Object.fromEntries(INBOXES.map(b => [b.id, DATA.rows.filter(r => r.account === b.id).length]));
  document.getElementById("inboxes").innerHTML = INBOXES.map(b =>
    `<button type="button" class="${INBOX===b.id?"on":""}" data-inbox="${b.id}">${b.label} ${boxCounts[b.id]}</button>`
  ).join("");

  const rows = DATA.rows.filter(r => r.account === INBOX);
  const counts = {
    all: rows.length,
    keep: rows.filter(r => r.action === "keep").length,
    archive: rows.filter(r => r.action === "archive").length,
    notes: rows.filter(r => openSavedNotes(r).length).length
  };
  const keys = [["all","All"],["keep","Kept"],["archive","Archived"],["notes","Notes"]];
  document.getElementById("pills").innerHTML = keys.map(([k,l]) =>
    `<button type="button" class="${ACTION===k?"on":""}" data-f="${k}">${l} ${counts[k]}</button>`
  ).join("");
}

function fmtDate(raw) {
  const t = Date.parse(raw || "");
  if (Number.isNaN(t)) return raw || "";
  return new Date(t).toLocaleString(undefined, {
    weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
  });
}

function headerRow() {
  return `<tr>${COLS.map(([id, label]) => {
    const sort = SORT.col === id ? (SORT.dir === "asc" ? "ascending" : "descending") : null;
    return `<th scope="col"${sort ? ` aria-sort="${sort}"` : ""}><button type="button" data-sort="${id}">${label}</button></th>`;
  }).join("")}</tr>`;
}

function render() {
  pills();
  const inbox = DATA.rows.filter(r => r.account === INBOX);
  const keep = inbox.filter(r => r.action === "keep").length;
  const archive = inbox.filter(r => r.action === "archive").length;
  const label = (INBOXES.find(b => b.id === INBOX) || {}).label || INBOX;
  const newest = inbox.slice().sort((a, b) => (arrivalMs(b) || 0) - (arrivalMs(a) || 0))[0];
  document.querySelector("[data-stats]").textContent =
    `${inbox.length} filed · ${keep} kept · ${archive} archived · ${label}` +
    (newest && newest.date ? ` · newest ${esc(fmtDate(newest.date))}` : "");

  const shown = visibleRows();
  const el = document.getElementById("list");
  if (!shown.length) {
    el.innerHTML = ACTION === "notes"
      ? '<div class="empty">No open notes in this inbox.</div>'
      : '<div class="empty">Nothing filed in this view.</div>';
    return;
  }
  el.innerHTML = `<div class="wrap"><table>
    <thead>${headerRow()}</thead>
    <tbody>${shown.map(rowHtml).join("")}</tbody>
  </table></div>`;
}

function splitLabels(raw) {
  return String(raw || "").split("|").map(s => s.trim()).filter(Boolean);
}

function labelCell(r) {
  const labels = splitLabels(r.labels);
  const primary = labels.length
    ? `<div class="label-list">${labels.map(l => `<span class="gmail-label">${esc(l)}</span>`).join("")}</div>`
    : `<div class="gmail-label">—</div>`;
  const rule = r.rule ? `<div class="rule-id">${esc(r.rule)}</div>` : "";
  return primary + rule;
}

function rowHtml(r) {
  const open = openSavedNotes(r);
  const latestOpen = open.length ? open[open.length - 1] : null;
  const saved = savedNotes(r);
  const latestSaved = saved.length ? saved[saved.length - 1] : null;
  const applied = !!(latestSaved && noteProcessed(latestSaved) && !latestOpen);
  const latest = latestOpen ? latestOpen.note : (applied ? "" : latestNote(r));
  const appliedText = applied && latestSaved ? latestSaved.note : "";
  let draft = Object.prototype.hasOwnProperty.call(DRAFTS, r.key) ? DRAFTS[r.key] : latest;
  if (applied && String(draft || "").trim() === String(appliedText || "").trim()) draft = "";
  const showClear = ACTION === "notes" && !!latestOpen;
  const statusClass = applied ? "status applied" : "status";
  const statusText = applied ? "Applied" : "";
  return `<tr data-key="${esc(r.key || "")}">
    <td class="date">${esc(fmtDate(r.date))}</td>
    <td class="from">${esc(r.from)}</td>
    <td class="subj">${esc(r.subject) || "(no subject)"}</td>
    <td><span class="act ${esc(r.action)}">${esc(r.action)}</span></td>
    <td class="labels"${r.rule ? ` title="Rule ${esc(r.rule)}"` : ""}>${labelCell(r)}</td>
    <td class="note-cell">
      <form class="note-form" data-key="${esc(r.key || "")}" data-note-id="${esc(latestOpen && latestOpen.id || "")}">
        <input name="note" type="text" maxlength="4000" value="${esc(draft)}" placeholder="Filing change for Cliff…" />
        <button type="submit">Save</button>
        ${showClear ? `<button type="button" class="clear" data-clear>Clear</button>` : ""}
        <span class="${statusClass}" aria-live="polite">${statusText}</span>
      </form>
    </td>
  </tr>`;
}

function esc(s) {
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function rememberDrafts() {
  document.querySelectorAll("form.note-form").forEach(form => {
    const input = form.querySelector("input[name=note]");
    if (input) DRAFTS[form.dataset.key] = input.value;
  });
}

document.getElementById("inboxes").addEventListener("click", e => {
  const b = e.target.closest("button[data-inbox]");
  if (!b) return;
  rememberDrafts();
  INBOX = b.dataset.inbox;
  render();
});
document.getElementById("pills").addEventListener("click", e => {
  const b = e.target.closest("button[data-f]");
  if (!b) return;
  rememberDrafts();
  ACTION = b.dataset.f;
  render();
});
document.getElementById("list").addEventListener("click", e => {
  const clear = e.target.closest("button[data-clear]");
  if (clear) {
    const form = clear.closest("form.note-form");
    if (form) clearNote(form);
    return;
  }
  const b = e.target.closest("button[data-sort]");
  if (!b) return;
  rememberDrafts();
  const col = b.dataset.sort;
  if (SORT.col === col) SORT.dir = SORT.dir === "asc" ? "desc" : "asc";
  else {
    SORT.col = col;
    SORT.dir = col === "date" ? "desc" : "asc";
  }
  render();
});
document.getElementById("list").addEventListener("submit", e => {
  const form = e.target.closest("form.note-form");
  if (!form) return;
  e.preventDefault();
  saveNote(form);
});

function applyNotes(notes, key, rowNotesList) {
  DATA.notes = notes || DATA.notes || [];
  const forRow = rowNotesList != null
    ? rowNotesList
    : (DATA.notes || []).filter(n => (n.key || "") === key);
  DATA.rows = DATA.rows.map(r => r.key === key ? { ...r, notes: forRow } : r);
}

function saveNote(form) {
  const key = form.dataset.key;
  const row = DATA.rows.find(r => (r.key || "") === key);
  if (!row) return;
  const input = form.querySelector("input[name=note]");
  const status = form.querySelector(".status");
  const button = form.querySelector("button[type=submit]");
  const note = String(input.value || "").trim();
  if (!note) {
    if (status) status.textContent = "Type a note first.";
    return;
  }
  if (note === latestNote(row)) {
    if (status) status.textContent = "Saved.";
    return;
  }
  if (button) button.disabled = true;
  if (status) status.textContent = "Saving…";
  fetch("/api/mail-notes", {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      account: row.account,
      from: row.from,
      subject: row.subject,
      date: row.date,
      action: row.action,
      rule: row.rule,
      labels: row.labels,
      key: row.key,
      note
    })
  })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      if (!ok) throw new Error(d.error || "save failed");
      applyNotes(d.notes, key);
      DRAFTS[key] = note;
      rememberDrafts();
      render();
      const next = [...document.querySelectorAll("form.note-form")]
        .find(f => f.dataset.key === key);
      if (next) {
        const s = next.querySelector(".status");
        if (s) {
          s.classList.remove("applied");
          s.textContent = "Saved.";
        }
      }
    })
    .catch(err => {
      if (button) button.disabled = false;
      if (status) status.textContent = err.message || "Could not save.";
    });
}

function clearNote(form) {
  const key = form.dataset.key;
  const id = form.dataset.noteId;
  const row = DATA.rows.find(r => (r.key || "") === key);
  if (!row) return;
  const status = form.querySelector(".status");
  const button = form.querySelector("button[data-clear]");
  if (button) button.disabled = true;
  if (status) {
    status.classList.remove("applied");
    status.textContent = "Clearing…";
  }
  fetch("/api/mail-notes", {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({ id, key, processed: true })
  })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      if (!ok) throw new Error(d.error || "clear failed");
      applyNotes(d.notes, key);
      rememberDrafts();
      DRAFTS[key] = "";
      render();
    })
    .catch(err => {
      if (button) button.disabled = false;
      if (status) status.textContent = err.message || "Could not clear.";
    });
}
bootMail();
</script>
</body>
</html>
