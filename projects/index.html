<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="dark light" />
<title>Projects — Ostroff.LA</title>
<link rel="icon" href="/favicon.svg" />
<style>
  :root {
    --bg:#0f1012; --panel:#17191d; --panel2:#1f2228; --line:#2a2e36; --text:#ececec; --muted:#8f96a1;
    --needs:#e5a23a; --active:#4c9eeb; --blocked:#e05d5d; --quiet:#7d8590; --ok:#4fb477; --bad:#e05d5d; --warn:#e5a23a;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme=dark]) {
    --bg:#f5f4f1; --panel:#fff; --panel2:#f0efeb; --line:#e2dfd8; --text:#1a1815; --muted:#6b6862; } }
  :root[data-theme=light] { --bg:#f5f4f1; --panel:#fff; --panel2:#f0efeb; --line:#e2dfd8; --text:#1a1815; --muted:#6b6862; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif; }
  a { color:inherit; }
  header { position:sticky; top:0; z-index:5; background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(8px);
    padding:12px 16px 8px; border-bottom:1px solid var(--line); }
  .top { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; letter-spacing:.02em; }
  .meta { color:var(--muted); font-size:12px; }
  .nav { margin-left:auto; display:flex; gap:12px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  .nav a { color:var(--muted); text-decoration:none; } .nav a:hover { color:var(--text); }
  .search { flex:1 1 220px; display:flex; gap:6px; }
  input[type=search] { flex:1; min-width:0; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  button.chip { background:var(--panel); color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; cursor:pointer; }
  button.chip[aria-pressed=true] { color:var(--text); border-color:var(--text); }
  .tabs { display:none; gap:6px; margin-top:8px; }
  .tabs button { flex:1; background:var(--panel); color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:8px 4px; font:600 12px/1 inherit; }
  .tabs button.on { color:var(--text); border-color:var(--c); box-shadow:inset 0 -2px 0 var(--c); }
  .attn { margin:12px 16px 0; border:1px solid var(--needs); border-radius:10px; background:color-mix(in srgb,var(--needs) 10%,var(--panel)); padding:8px 12px; }
  .attn h2 { margin:0 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--needs); }
  .attn li { margin:4px 0; } .attn ul { margin:0; padding-left:18px; }
  .board { display:grid; grid-template-columns:repeat(4,minmax(260px,1fr)); gap:12px; padding:12px 16px 40px; align-items:start; }
  .col { background:var(--panel2); border-radius:12px; padding:8px; min-height:120px; scroll-margin-top:120px; }
  .col h2 { display:flex; align-items:center; gap:8px; font-size:12px; text-transform:uppercase; letter-spacing:.1em; margin:4px 4px 10px; }
  .col h2::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--c); }
  .badge { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:1px 8px; font-size:11px; color:var(--muted); }
  .card { position:relative; background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--pc); border-radius:10px; padding:10px 10px 8px; margin-bottom:8px; outline:none; }
  .card:focus-visible, .card.sel { box-shadow:0 0 0 2px var(--active); }
  .card.needs { animation:pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 color-mix(in srgb,var(--needs) 0%,transparent); } 50% { box-shadow:0 0 0 4px color-mix(in srgb,var(--needs) 28%,transparent); } }
  @media (prefers-reduced-motion: reduce) { .card.needs { animation:none; } }
  .ch { display:flex; gap:8px; align-items:center; }
  .ico { width:30px; height:30px; flex:none; border-radius:8px; display:grid; place-items:center; font-size:17px; background:color-mix(in srgb,var(--pc) 22%,transparent); }
  .name { font-weight:650; font-size:14.5px; } .sub { color:var(--muted); font-size:11.5px; }
  .spark { margin-left:auto; color:var(--pc); flex:none; }
  .reasons { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0 2px; }
  .tag { font-size:11px; border-radius:6px; padding:1px 6px; background:var(--panel2); color:var(--muted); border:1px solid var(--line); }
  .tag.r { color:var(--needs); border-color:color-mix(in srgb,var(--needs) 45%,transparent); }
  .tag.b { color:var(--bad); border-color:color-mix(in srgb,var(--bad) 45%,transparent); }
  .tag.s { color:var(--muted); border-style:dashed; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; margin:8px 0; font-size:12px; }
  .stats div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:1px; background:var(--quiet); }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); } .dot.warn { background:var(--warn); }
  .commit, .note { font-size:12px; color:var(--muted); margin-top:6px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .note b { color:var(--text); font-weight:600; }
  .links { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; }
  .links a, .links button { font-size:11.5px; text-decoration:none; color:var(--muted); background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:3px 7px; font-family:inherit; cursor:pointer; }
  .links a:hover, .links button:hover { color:var(--text); }
  .links code { font:11px ui-monospace,Menlo,monospace; }
  .empty { color:var(--muted); font-size:12px; padding:8px; }
  .kbd { color:var(--muted); font-size:11px; padding:0 16px 24px; }
  @media (max-width: 820px) {
    body { font-size:15px; }
    .tabs { display:flex; }
    .nav { display:none; }
    .board { grid-template-columns:repeat(4,100%); overflow-x:auto; scroll-snap-type:x mandatory; gap:0; padding:8px 0 80px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .board::-webkit-scrollbar { display:none; }
    .col { scroll-snap-align:start; margin:0 10px; background:transparent; padding:0; }
    .col h2 { display:none; }
    .kbd { display:none; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Projects</h1>
    <span class="meta" id="gen">loading…</span>
    <nav class="nav"><a href="/">Home</a><a href="/bots/">Bots</a><a href="/tickets/">Tickets</a><a href="/trips/">Trips</a></nav>
  </div>
  <div class="top" style="margin-top:8px">
    <div class="search">
      <input id="q" type="search" placeholder="Filter projects…  ( / )" autocomplete="off" aria-label="Filter projects" />
      <button class="chip" id="hideQuiet" aria-pressed="false" title="Hide stale quiet projects">Hide stale</button>
      <button class="chip" id="theme" title="Toggle theme">◐</button>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>
<section class="attn" id="attn" hidden><h2>Attention</h2><ul id="attnList"></ul></section>
<main class="board" id="board"></main>
<p class="kbd">Keys: <b>/</b> search · <b>1–4</b> jump to column · <b>j/k</b> next/prev card · <b>o</b> open live site · <b>g</b> GitHub · <b>Esc</b> clear</p>
<script>
const COLS = [
  { id:'needs', label:'Needs you', c:'var(--needs)' },
  { id:'active', label:'In progress', c:'var(--active)' },
  { id:'blocked', label:'Blocked', c:'var(--blocked)' },
  { id:'quiet', label:'Quiet', c:'var(--quiet)' },
];
const MAC_ROOT = '/Users/nickostroff/claude-global/claude-projects/';
let DATA = null, sel = -1;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const safeUrl = (u) => /^https:\/\//.test(u || '') ? u : null;
function ago(iso) {
  if (!iso) return '—';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'just now';
  const u = [[86400*30,'mo'],[86400*7,'w'],[86400,'d'],[3600,'h'],[60,'m']];
  for (const [n, l] of u) if (s >= n) return `${Math.floor(s / n)}${l} ago`;
}
function spark(arr) {
  const w = 70, h = 18, max = Math.max(1, ...arr), n = arr.length || 1;
  const bw = w / n;
  const bars = arr.map((v, i) => { const bh = v ? Math.max(2, (v / max) * h) : 1;
    return `<rect x="${(i * bw).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${(bw - 1).toFixed(1)}" height="${bh.toFixed(1)}" rx="1" opacity="${v ? 0.9 : 0.25}"/>`; }).join('');
  const total = arr.reduce((a, b) => a + b, 0);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="currentColor" role="img" aria-label="${total} events in 14 days"><title>${total} events · last 14 days</title>${bars}</svg>`;
}
function card(p) {
  const g = p.github_info || {}, d = p.deploy, u = p.uptime, t = p.tasks, n = p.note;
  const prs = g.prs || [];
  const prFail = prs.filter((x) => x.checks === 'failing').length;
  const dState = d ? d.state : null;
  const dCls = dState === 'READY' ? 'ok' : dState === 'ERROR' ? 'bad' : dState ? 'warn' : '';
  const chk = g.main_checks, cCls = chk === 'passing' ? 'ok' : chk === 'failing' ? 'bad' : chk === 'pending' ? 'warn' : '';
  const reasons = (p.reasons || []).map((r) => `<span class="tag ${p.column === 'blocked' ? 'b' : 'r'}">${esc(r)}</span>`).join('')
    + (p.stale_days != null ? `<span class="tag s">Stale${p.stale_days != null ? ' · ' + p.stale_days + 'd' : ''}</span>` : '')
    + (p.paused ? '' : '');
  const live = safeUrl(p.url);
  const links = [
    p.github && `<a href="https://github.com/${esc(p.github)}" target="_blank" rel="noopener">GitHub</a>`,
    d && safeUrl(d.dashboard) && `<a href="${esc(d.dashboard)}" target="_blank" rel="noopener">Vercel</a>`,
    live && `<a href="${esc(live)}" target="_blank" rel="noopener">Live ↗</a>`,
    p.local && `<button type="button" data-copy="${esc(MAC_ROOT + p.local)}" title="Copy Mac Studio path"><code>${esc(p.local)}</code> · copy</button>`,
  ].filter(Boolean).join('');
  return `<article class="card ${p.column === 'needs' ? 'needs' : ''}" tabindex="0" data-slug="${esc(p.slug)}" style="--pc:${esc(p.color || '#888')}"
      data-live="${esc(live || '')}" data-gh="${esc(p.github || '')}">
    <div class="ch"><div class="ico" aria-hidden="true">${esc(p.icon || '•')}</div>
      <div><div class="name">${esc(p.name)}</div><div class="sub">${p.paused ? 'Paused · ' : ''}moved ${esc(ago(p.last_move))}${p.bot ? ' · ' + esc(p.bot) : ''}</div></div>
      ${spark(p.spark || [])}</div>
    ${reasons ? `<div class="reasons">${reasons}</div>` : ''}
    <div class="stats">
      <div title="Open Todoist tasks">☑ ${t && t.open != null ? esc(t.open) + ' open' + (t.p1 ? ` · ${esc(t.p1)} p1` : '') : '<span class="meta">no tasks</span>'}</div>
      <div title="Open PRs">⇄ ${prs.length} PR${prs.length === 1 ? '' : 's'}${prFail ? ` · <span style="color:var(--bad)">${prFail} failing</span>` : ''}</div>
      <div title="Production deploy">${d ? `<span class="dot ${dCls}"></span>${esc(dState.toLowerCase())} · ${esc(ago(d.at))}` : '<span class="meta">no deploy</span>'}</div>
      <div title="Live site probe">${u ? `<span class="dot ${u.up ? 'ok' : 'bad'}"></span>${u.up ? 'up' : 'down'} · ${u.code || '—'} · ${esc(u.ms)}ms` : '<span class="meta">no URL</span>'}</div>
      ${chk && chk !== 'none' ? `<div title="Checks on default branch"><span class="dot ${cCls}"></span>main checks ${esc(chk)}</div>` : ''}
      ${t && t.paige ? `<div title="Paige gate report ${esc(t.paige.run)}">Paige: ${esc(t.paige.open)}/${esc(t.paige.app_open)}${t.paige.diffs ? ' · ' + esc(t.paige.diffs) + ' diff' : ''}</div>` : ''}
    </div>
    ${g.last_commit ? `<div class="commit">● <a href="${esc(safeUrl(g.last_commit.url) || '#')}" target="_blank" rel="noopener">${esc(g.last_commit.sha)}</a> ${esc(g.last_commit.msg)} · ${esc(ago(g.last_commit.at))}</div>` : ''}
    ${n ? `<div class="note"><b>${esc(n.bot)}</b> ${esc(ago(n.at))}: ${esc(n.text)}</div>` : ''}
    <div class="links">${links}</div>
  </article>`;
}
function render() {
  if (!DATA) return;
  const q = $('#q').value.trim().toLowerCase();
  const hide = $('#hideQuiet').getAttribute('aria-pressed') === 'true';
  const list = DATA.projects.filter((p) => !q || JSON.stringify([p.name, p.slug, p.github, p.local, p.reasons, p.note && p.note.text]).toLowerCase().includes(q))
    .filter((p) => !(hide && p.stale_days != null));
  const by = Object.fromEntries(COLS.map((c) => [c.id, []]));
  list.forEach((p) => by[p.column].push(p));
  const t = (p) => new Date(p.last_move || 0).getTime();
  for (const id in by) by[id].sort((a, b) => id === 'quiet'
    ? ((b.stale_days != null) - (a.stale_days != null)) || (b.stale_days || 0) - (a.stale_days || 0) || a.name.localeCompare(b.name)
    : t(b) - t(a));
  $('#board').innerHTML = COLS.map((c) => `<section class="col" id="col-${c.id}" style="--c:${c.c}" aria-label="${c.label}">
    <h2>${c.label} <span class="badge">${by[c.id].length}</span></h2>
    ${by[c.id].map(card).join('') || '<div class="empty">Nothing here.</div>'}</section>`).join('');
  $('#tabs').innerHTML = COLS.map((c, i) => `<button role="tab" data-i="${i}" style="--c:${c.c}">${c.label} <span class="badge">${by[c.id].length}</span></button>`).join('');
  syncTab(); sel = -1;
}
function syncTab() {
  const b = $('#board'); const i = Math.round(b.scrollLeft / Math.max(1, b.clientWidth));
  document.querySelectorAll('#tabs button').forEach((x, j) => x.classList.toggle('on', j === i));
}
function jump(i) {
  const col = $(`#col-${COLS[i].id}`); if (!col) return;
  if (matchMedia('(max-width: 820px)').matches) $('#board').scrollTo({ left: i * $('#board').clientWidth, behavior: 'smooth' });
  else col.scrollIntoView({ behavior: 'smooth', block: 'start' });
  const first = col.querySelector('.card'); if (first) { first.focus({ preventScroll: true }); sel = [...document.querySelectorAll('.card')].indexOf(first); }
}
function move(dir) {
  const cards = [...document.querySelectorAll('.card')]; if (!cards.length) return;
  sel = Math.max(0, Math.min(cards.length - 1, sel + dir));
  cards.forEach((c, i) => c.classList.toggle('sel', i === sel));
  cards[sel].focus(); cards[sel].scrollIntoView({ block: 'nearest', inline: 'start', behavior: 'smooth' });
}
async function load() {
  try {
    const r = await fetch('/api/projects', { credentials: 'same-origin', cache: 'no-store' });
    if (r.status === 401) { location.href = '/login/?next=/projects/'; return; }
    const j = await r.json();
    if (j.empty) { $('#gen').textContent = 'No snapshot yet — the box routine has not uploaded one.'; return; }
    DATA = j;
    const s = j.sources || {};
    $('#gen').textContent = `updated ${ago(j.generated_at)} · ${j.projects.length} projects`;
    $('#gen').title = `Snapshot ${j.generated_at}\nSources: ${Object.entries(s).map(([k, v]) => `${k} ${v === true ? 'ok' : v === false ? 'MISSING' : v}`).join(', ')}`;
    const a = j.attention || [];
    $('#attn').hidden = !a.length;
    $('#attnList').innerHTML = a.map((x) => `<li>${x.project ? `<b>${esc(x.project)}</b> · ` : ''}${safeUrl(x.link) ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.text)}</a>` : esc(x.text)} <span class="meta">${esc(x.from || '')} ${esc(ago(x.created_at))}</span></li>`).join('');
    render();
  } catch { $('#gen').textContent = 'Snapshot unavailable.'; }
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); const o = b.innerHTML; b.textContent = 'Copied ✓'; setTimeout(() => { b.innerHTML = o; }, 1200); } catch {}
});
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) jump(+b.dataset.i); });
$('#board').addEventListener('scroll', () => requestAnimationFrame(syncTab), { passive: true });
$('#q').addEventListener('input', render);
$('#hideQuiet').addEventListener('click', (e) => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', on); render(); });
const savedTheme = localStorage.getItem('projects-theme'); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const next = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; localStorage.setItem('projects-theme', next);
});
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const inInput = e.target.matches('input, textarea');
  if (e.key === 'Escape') { $('#q').value = ''; $('#q').blur(); render(); return; }
  if (inInput) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if ('1234'.includes(e.key)) jump(+e.key - 1);
  else if (e.key === 'j') move(1);
  else if (e.key === 'k') move(-1);
  else if (e.key === 'o' || e.key === 'g') {
    const c = document.activeElement.closest?.('.card'); if (!c) return;
    const u = e.key === 'o' ? c.dataset.live : (c.dataset.gh && `https://github.com/${c.dataset.gh}`);
    if (u) window.open(u, '_blank', 'noopener');
  }
});
// Default dark unless system asks for light (handled in CSS); refresh relative times + data.
load(); setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
