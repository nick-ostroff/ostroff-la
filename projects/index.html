<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Projects — Ostroff.LA</title>
<link rel="icon" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/app.css" />
<style>
  :root { --needs:#cf3520; --active:#0f66ae; --blocked:#e34432; --quiet:#94928f; --ok:#446c3d; --bad:#e34432; --warn:#cf3520; }
  .head { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .head .page-title { margin:0; }
  .head .meta { color:var(--color-pencil); font-size:12px; }
  .search { margin-left:auto; display:flex; gap:6px; flex:0 1 360px; min-width:220px; }
  .search .input { flex:1; }
  .tabs { display:none; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; background:var(--color-paper); color:var(--color-pencil); border:1px solid var(--color-stone); border-radius:var(--radius); padding:8px 4px; font-size:12px; font-weight:600; cursor:pointer; }
  .tabs button.on { color:var(--color-ink); border-color:var(--c); box-shadow:inset 0 -2px 0 var(--c); }
  .attn { margin:0 0 16px; border-radius:var(--radius); background:var(--color-cream); border:1px solid var(--wash-red-line); padding:10px 14px; }
  .attn h2 { margin:0 0 4px; }
  .attn ul { margin:0; padding-left:18px; } .attn li { margin:4px 0; }
  .board { display:grid; grid-template-columns:repeat(4,minmax(240px,1fr)); gap:12px; align-items:start; }
  .col { background:var(--color-cream); border-radius:var(--radius); padding:8px; min-height:120px; scroll-margin-top:120px; }
  .col h2 { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--color-pencil); letter-spacing:.14px; margin:4px 4px 10px; }
  .col h2::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--c); }
  .card.proj { position:relative; border-left:4px solid var(--pc); padding:10px 12px 8px; margin-bottom:8px; outline:none; }
  .card.proj:focus-visible, .card.proj.sel { box-shadow:0 0 0 2px var(--color-sky-wash), 0 0 0 3px var(--active); }
  .ch { display:flex; gap:8px; align-items:center; }
  .ico { width:30px; height:30px; flex:none; border-radius:var(--radius); display:grid; place-items:center; font-size:17px; background:color-mix(in srgb,var(--pc) 18%,transparent); }
  .name { font-weight:600; font-size:14px; } .sub { color:var(--color-pencil); font-size:11.5px; }
  .spark { margin-left:auto; color:var(--pc); flex:none; }
  .reasons { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0 2px; }
  .tag { font-size:11px; font-weight:600; border-radius:var(--radius); padding:1px 7px; background:var(--wash-ink); color:var(--color-pencil); }
  .tag.r { background:var(--color-cream); color:var(--needs); box-shadow:inset 0 0 0 1px var(--wash-red-line); }
  .tag.b { background:var(--wash-red); color:var(--bad); }
  .tag.s { background:transparent; box-shadow:inset 0 0 0 1px var(--color-stone); }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; margin:8px 0; font-size:12px; }
  .stats div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:1px; background:var(--quiet); }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); } .dot.warn { background:var(--warn); }
  .commit, .note { font-size:12px; color:var(--color-pencil); margin-top:6px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .note b { color:var(--color-ink); font-weight:600; }
  .links { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; }
  .links a, .links button { font-size:11.5px; text-decoration:none; color:var(--color-pencil); background:var(--color-paper); border:1px solid var(--color-stone); border-radius:6px; padding:3px 7px; font-family:inherit; cursor:pointer; }
  .links a:hover, .links button:hover { color:var(--color-deep-ember); text-decoration:none; }
  .links code { font:11px var(--mono); }
  .col .empty { font-size:12px; padding:8px; }
  .kbd { color:var(--color-graphite); font-size:11px; padding:24px 0 0; }
  .viewtog { display:flex; gap:0; border:1px solid var(--color-stone); border-radius:var(--radius); overflow:hidden; }
  .viewtog button { background:var(--color-paper); border:0; padding:6px 12px; font:600 12px inherit; font-family:inherit; color:var(--color-pencil); cursor:pointer; }
  .viewtog button.on { background:var(--color-ink); color:var(--color-paper); }
  .lfilters { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; align-items:center; }
  .lfilters select { font:12px inherit; font-family:inherit; padding:5px 6px; border:1px solid var(--color-stone); border-radius:6px; background:var(--color-paper); color:var(--color-ink); }
  .lfilters label { font-size:12px; color:var(--color-pencil); display:flex; gap:4px; align-items:center; }
  .ltable { width:100%; border-collapse:collapse; font-size:12.5px; }
  .ltable th { text-align:left; font-size:11px; font-weight:600; color:var(--color-pencil); padding:6px 8px; border-bottom:1px solid var(--color-stone); cursor:pointer; white-space:nowrap; user-select:none; position:sticky; top:0; background:var(--color-paper); z-index:1; }
  .ltable th[data-dir="asc"]::after { content:" ▲"; } .ltable th[data-dir="desc"]::after { content:" ▼"; }
  .ltable td { padding:8px; border-bottom:1px solid var(--color-stone); vertical-align:top; }
  .ltable tr.lrow { cursor:pointer; } .ltable tr.lrow:hover td { background:var(--color-cream); }
  .ltable tr.ldet td { background:var(--color-cream); padding:10px 14px 14px; }
  .lname { display:flex; gap:8px; align-items:center; min-width:170px; }
  .ldesc { color:var(--color-pencil); max-width:420px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .colpill { font-size:11px; font-weight:600; border-radius:999px; padding:1px 8px; color:#fff; background:var(--c); white-space:nowrap; }
  .chips { display:flex; flex-wrap:wrap; gap:3px; } .chip { font-size:10.5px; border-radius:4px; padding:0 5px; background:var(--wash-ink); color:var(--color-pencil); white-space:nowrap; }
  .warnflag { font-size:10.5px; font-weight:600; color:var(--needs); white-space:nowrap; }
  .detgrid { display:grid; grid-template-columns:110px 1fr; gap:6px 12px; font-size:12.5px; }
  .detgrid dt { color:var(--color-pencil); font-weight:600; } .detgrid dd { margin:0; }
  .lcards { display:none; }
  .lcard { border-left:4px solid var(--pc); padding:10px 12px; margin-bottom:8px; }
  @media (max-width: 820px) {
    .ltable { display:none; } .lcards { display:block; }
    .detgrid { grid-template-columns:1fr; } .detgrid dt { margin-top:6px; }
  }
  @media (max-width: 820px) {
    .tabs { display:flex; }
    .search { margin-left:0; flex:1 1 100%; flex-wrap:wrap; min-width:0; }
    .search .input { flex:1 1 100%; }
    .lfilters select { flex:1 1 30%; min-width:0; }
    .board { grid-template-columns:repeat(4,100%); overflow-x:auto; scroll-snap-type:x mandatory; gap:0; margin:0 -16px; padding:0 0 40px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .board::-webkit-scrollbar { display:none; }
    .col { scroll-snap-align:start; margin:0 10px; background:transparent; padding:0; }
    .col h2 { display:none; }
    .kbd { display:none; }
  }
</style>
</head>
<body class="app">
<aside class="side" data-sidebar></aside>
<main class="main wide" data-page-title="Projects">
  <div class="head">
    <h1 class="page-title">Projects</h1>
    <span class="meta" id="gen">loading…</span>
    <div class="search">
      <input id="q" class="input sm" type="search" placeholder="Filter projects…  ( / )" autocomplete="off" aria-label="Filter projects" />
      <div class="viewtog" role="tablist" aria-label="View"><button type="button" id="vBoard" class="on">Board</button><button type="button" id="vList">List</button></div>
      <button class="pill" id="hideQuiet" aria-pressed="false" title="Hide stale quiet projects">Hide stale</button>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <section class="attn" id="attn" hidden><h2 class="eyebrow">Attention</h2><ul id="attnList"></ul></section>
  <div id="boardWrap"><div class="board" id="board"></div></div>
  <section id="listWrap" hidden>
    <div class="lfilters">
      <select id="fBucket" aria-label="Bucket"><option value="">All buckets</option></select>
      <select id="fStatus" aria-label="Status"><option value="">All statuses</option><option value="needs">Needs you</option><option value="active">In progress</option><option value="blocked">Blocked</option><option value="quiet">Quiet</option></select>
      <select id="fStack" aria-label="Stack"><option value="">Any stack</option></select>
      <label><input type="checkbox" id="fNoClaude" /> CLAUDE.md missing/stale</label>
      <label><input type="checkbox" id="fHideCopies" checked /> Hide working copies</label>
      <select id="fSort" aria-label="Sort" class="lsort-m"><option value="name">Sort: name</option><option value="commit">Sort: last commit</option><option value="status">Sort: status</option><option value="bucket">Sort: bucket</option></select>
      <span class="meta" id="lcount"></span>
    </div>
    <table class="ltable"><thead><tr>
      <th data-k="name">Project</th><th data-k="bucket">Bucket</th><th data-k="status">Status</th><th data-k="desc">Description</th>
      <th data-k="stack">Stack</th><th data-k="claude">CLAUDE.md</th><th data-k="commit">Last commit</th><th>Links</th>
    </tr></thead><tbody id="ltbody"></tbody></table>
    <div class="lcards" id="lcards"></div>
  </section>
  <p class="kbd">Keys: <b>b</b>/<b>l</b> board/list · <b>/</b> search · <b>1–4</b> jump to column · <b>j/k</b> next/prev card · <b>o</b> open live site · <b>g</b> GitHub · <b>Esc</b> clear</p>
</main>
<script src="/assets/app.js"></script>
<script>
const COLS = [
  { id:'needs', label:'Needs you', c:'var(--needs)' },
  { id:'active', label:'In progress', c:'var(--active)' },
  { id:'blocked', label:'Blocked', c:'var(--blocked)' },
  { id:'quiet', label:'Quiet', c:'var(--quiet)' },
];
const MAC_ROOT = '/Users/nickostroff/claude-global/claude-projects/';
let DATA = null, sel = -1;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const safeUrl = (u) => /^https:\/\//.test(u || '') ? u : null;
function ago(iso) {
  if (!iso) return '—';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'just now';
  const u = [[86400*30,'mo'],[86400*7,'w'],[86400,'d'],[3600,'h'],[60,'m']];
  for (const [n, l] of u) if (s >= n) return `${Math.floor(s / n)}${l} ago`;
}
function spark(arr) {
  const w = 70, h = 18, max = Math.max(1, ...arr), n = arr.length || 1;
  const bw = w / n;
  const bars = arr.map((v, i) => { const bh = v ? Math.max(2, (v / max) * h) : 1;
    return `<rect x="${(i * bw).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${(bw - 1).toFixed(1)}" height="${bh.toFixed(1)}" rx="1" opacity="${v ? 0.9 : 0.25}"/>`; }).join('');
  const total = arr.reduce((a, b) => a + b, 0);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="currentColor" role="img" aria-label="${total} events in 14 days"><title>${total} events · last 14 days</title>${bars}</svg>`;
}
function card(p) {
  const g = p.github_info || {}, d = p.deploy, u = p.uptime, t = p.tasks, n = p.note;
  const prs = g.prs || [];
  const prFail = prs.filter((x) => x.checks === 'failing').length;
  const dState = d ? d.state : null;
  const dCls = dState === 'READY' ? 'ok' : dState === 'ERROR' ? 'bad' : dState ? 'warn' : '';
  const chk = g.main_checks, cCls = chk === 'passing' ? 'ok' : chk === 'failing' ? 'bad' : chk === 'pending' ? 'warn' : '';
  const reasons = (p.reasons || []).map((r) => `<span class="tag ${p.column === 'blocked' ? 'b' : 'r'}">${esc(r)}</span>`).join('')
    + (p.stale_days != null ? `<span class="tag s">Stale${p.stale_days != null ? ' · ' + p.stale_days + 'd' : ''}</span>` : '');
  const live = safeUrl(p.url);
  const links = [
    p.github && `<a href="https://github.com/${esc(p.github)}" target="_blank" rel="noopener">GitHub</a>`,
    d && safeUrl(d.dashboard) && `<a href="${esc(d.dashboard)}" target="_blank" rel="noopener">Vercel</a>`,
    live && `<a href="${esc(live)}" target="_blank" rel="noopener">Live ↗</a>`,
    p.local && `<button type="button" data-copy="${esc(MAC_ROOT + p.local)}" title="Copy Mac Studio path"><code>${esc(p.local)}</code> · copy</button>`,
  ].filter(Boolean).join('');
  return `<article class="card proj" tabindex="0" data-slug="${esc(p.slug)}" style="--pc:${esc(p.color || '#94928f')}"
      data-live="${esc(live || '')}" data-gh="${esc(p.github || '')}">
    <div class="ch"><div class="ico" aria-hidden="true">${esc(p.icon || '•')}</div>
      <div><div class="name">${esc(p.name)}</div><div class="sub">${p.paused ? 'Paused · ' : ''}moved ${esc(ago(p.last_move))}${p.bot ? ' · ' + esc(p.bot) : ''}</div></div>
      ${spark(p.spark || [])}</div>
    ${reasons ? `<div class="reasons">${reasons}</div>` : ''}
    <div class="stats">
      <div title="Open Todoist tasks">☑ ${t && t.open != null ? esc(t.open) + ' open' + (t.p1 ? ` · ${esc(t.p1)} p1` : '') : '<span class="muted">no tasks</span>'}</div>
      <div title="Open PRs">⇄ ${prs.length} PR${prs.length === 1 ? '' : 's'}${prFail ? ` · <span style="color:var(--bad)">${prFail} failing</span>` : ''}</div>
      <div title="Production deploy">${d ? `<span class="dot ${dCls}"></span>${esc(dState.toLowerCase())} · ${esc(ago(d.at))}` : '<span class="muted">no deploy</span>'}</div>
      <div title="Live site probe">${u ? `<span class="dot ${u.up ? 'ok' : 'bad'}"></span>${u.up ? 'up' : 'down'} · ${u.code || '—'} · ${esc(u.ms)}ms` : '<span class="muted">no URL</span>'}</div>
      ${chk && chk !== 'none' ? `<div title="Checks on default branch"><span class="dot ${cCls}"></span>main checks ${esc(chk)}</div>` : ''}
      ${t && t.paige ? `<div title="Paige gate report ${esc(t.paige.run)}">Paige: ${esc(t.paige.open)}/${esc(t.paige.app_open)}${t.paige.diffs ? ' · ' + esc(t.paige.diffs) + ' diff' : ''}</div>` : ''}
    </div>
    ${g.last_commit ? `<div class="commit">● <a href="${esc(safeUrl(g.last_commit.url) || '#')}" target="_blank" rel="noopener">${esc(g.last_commit.sha)}</a> ${esc(g.last_commit.msg)} · ${esc(ago(g.last_commit.at))}</div>` : ''}
    ${n ? `<div class="note"><b>${esc(n.bot)}</b> ${esc(ago(n.at))}: ${esc(n.text)}</div>` : ''}
    <div class="links">${links}</div>
  </article>`;
}
function render() {
  if (!DATA) return;
  const q = $('#q').value.trim().toLowerCase();
  const hide = $('#hideQuiet').getAttribute('aria-pressed') === 'true';
  if (VIEW === 'list') return renderList();
  const list = DATA.projects.filter((p) => !p.list_only).filter((p) => !q || JSON.stringify([p.name, p.slug, p.github, p.local, p.reasons, p.note && p.note.text]).toLowerCase().includes(q))
    .filter((p) => !(hide && p.stale_days != null));
  const by = Object.fromEntries(COLS.map((c) => [c.id, []]));
  list.forEach((p) => { if (by[p.column]) by[p.column].push(p); });
  const t = (p) => new Date(p.last_move || 0).getTime();
  for (const id in by) by[id].sort((a, b) => id === 'quiet'
    ? ((b.stale_days != null) - (a.stale_days != null)) || (b.stale_days || 0) - (a.stale_days || 0) || a.name.localeCompare(b.name)
    : t(b) - t(a));
  $('#board').innerHTML = COLS.map((c) => `<section class="col" id="col-${c.id}" style="--c:${c.c}" aria-label="${c.label}">
    <h2>${c.label} <span class="badge">${by[c.id].length}</span></h2>
    ${by[c.id].map(card).join('') || '<div class="empty">Nothing here.</div>'}</section>`).join('');
  $('#tabs').innerHTML = COLS.map((c, i) => `<button role="tab" data-i="${i}" style="--c:${c.c}">${c.label} <span class="badge">${by[c.id].length}</span></button>`).join('');
  syncTab(); sel = -1;
}
function syncTab() {
  const b = $('#board'); const i = Math.round(b.scrollLeft / Math.max(1, b.clientWidth));
  document.querySelectorAll('#tabs button').forEach((x, j) => x.classList.toggle('on', j === i));
}
function jump(i) {
  const col = $(`#col-${COLS[i].id}`); if (!col) return;
  if (matchMedia('(max-width: 820px)').matches) $('#board').scrollTo({ left: i * $('#board').clientWidth, behavior: 'smooth' });
  else col.scrollIntoView({ behavior: 'smooth', block: 'start' });
  const first = col.querySelector('.card'); if (first) { first.focus({ preventScroll: true }); sel = [...document.querySelectorAll('.card.proj')].indexOf(first); }
}
function move(dir) {
  const cards = [...document.querySelectorAll('.card.proj')]; if (!cards.length) return;
  sel = Math.max(0, Math.min(cards.length - 1, sel + dir));
  cards.forEach((c, i) => c.classList.toggle('sel', i === sel));
  cards[sel].focus(); cards[sel].scrollIntoView({ block: 'nearest', inline: 'start', behavior: 'smooth' });
}
async function load() {
  try {
    const r = await fetch('/api/projects', { credentials: 'same-origin', cache: 'no-store' });
    if (r.status === 401) { location.href = '/login/?next=/projects/'; return; }
    const j = await r.json();
    if (j.empty) { $('#gen').textContent = 'No snapshot yet — the box routine has not uploaded one.'; return; }
    DATA = j;
    const s = j.sources || {};
    $('#gen').textContent = `updated ${ago(j.generated_at)} · ${j.projects.filter((p) => !p.list_only).length} on board · ${j.projects.length} total${j.local_collected_at ? ' · local scan ' + ago(j.local_collected_at) : ''}`;
    $('#gen').title = `Snapshot ${j.generated_at}\nSources: ${Object.entries(s).map(([k, v]) => `${k} ${v === true ? 'ok' : v === false ? 'MISSING' : v}`).join(', ')}`;
    const a = j.attention || [];
    $('#attn').hidden = !a.length;
    $('#attnList').innerHTML = a.map((x) => `<li>${x.project ? `<b>${esc(x.project)}</b> · ` : ''}${safeUrl(x.link) ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.text)}</a>` : esc(x.text)} <span class="meta">${esc(x.from || '')} ${esc(ago(x.created_at))}</span></li>`).join('');
    fillFilters(); setView(VIEW);
  } catch { $('#gen').textContent = 'Snapshot unavailable.'; }
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); const o = b.innerHTML; b.textContent = 'Copied ✓'; setTimeout(() => { b.innerHTML = o; }, 1200); } catch {}
});
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) jump(+b.dataset.i); });
$('#board').addEventListener('scroll', () => requestAnimationFrame(syncTab), { passive: true });
$('#q').addEventListener('input', render);
$('#hideQuiet').addEventListener('click', (e) => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', on); e.currentTarget.classList.toggle('on', on); render(); });
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const inInput = e.target.matches('input, textarea');
  if (e.key === 'Escape') { $('#q').value = ''; $('#q').blur(); render(); return; }
  if (inInput) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'b') setView('board');
  else if (e.key === 'l') setView('list');
  else if (VIEW === 'list') return;
  else if ('1234'.includes(e.key)) jump(+e.key - 1);
  else if (e.key === 'j') move(1);
  else if (e.key === 'k') move(-1);
  else if (e.key === 'o' || e.key === 'g') {
    const c = document.activeElement.closest?.('.card.proj'); if (!c) return;
    const u = e.key === 'o' ? c.dataset.live : (c.dataset.gh && `https://github.com/${c.dataset.gh}`);
    if (u) window.open(u, '_blank', 'noopener');
  }
});

let VIEW = localStorage.getItem('projView') === 'list' ? 'list' : 'board';
let SORT = { k: 'name', dir: 'asc' }, OPEN = new Set();
const COLMAP = Object.fromEntries(COLS.map((c, i) => [c.id, { ...c, i }]));
const BUCKETS = { '99-apps': '99 Apps', 'nick-ostroff': 'Nick Ostroff', 'pixelocity-apps': 'Pixelocity' };
const commitOf = (p) => (p.github_info && p.github_info.last_commit) || (p.info && p.info.local_commit) || null;
function linksFor(p) {
  const I = p.info || {}, d = p.deploy, live = safeUrl(p.url), c = commitOf(p);
  const vd = (d && safeUrl(d.dashboard)) || safeUrl(I.vercel_dashboard);
  return [
    p.github && `<a href="https://github.com/${esc(p.github)}" target="_blank" rel="noopener">GitHub</a>`,
    p.github && `<a href="https://github.com/${esc(p.github)}/pulls" target="_blank" rel="noopener">PRs</a>`,
    vd && `<a href="${esc(vd)}" target="_blank" rel="noopener">Vercel</a>`,
    safeUrl(I.preview) && `<a href="${esc(I.preview)}" target="_blank" rel="noopener">Previews</a>`,
    live && `<a href="${esc(live)}" target="_blank" rel="noopener">Live ↗</a>`,
    safeUrl(I.supabase) && `<a href="${esc(I.supabase)}" target="_blank" rel="noopener">Supabase</a>`,
    p.github && I.has_claude && `<a href="https://github.com/${esc(p.github)}/blob/HEAD/CLAUDE.md" target="_blank" rel="noopener">CLAUDE.md</a>`,
    p.local && `<button type="button" data-copy="${esc(MAC_ROOT + p.local)}" title="Copy Mac Studio path"><code>${esc(p.local)}</code> · copy</button>`,
  ].filter(Boolean).join('');
}
function claudeFlag(I) {
  if (!I) return '<span class="muted">not local</span>';
  if (!I.has_claude) return `<span class="warnflag">missing${I.has_readme ? ' · README only' : ''}</span>`;
  return I.claude_stale ? `<span class="warnflag" title="CLAUDE.md last edited ${esc(I.claude_mtime)}; repo has newer commits (>14d)">stale · ${esc(ago(I.claude_mtime))}</span>` : `<span class="muted">ok · ${esc(ago(I.claude_mtime))}</span>`;
}
function details(p) {
  const I = p.info || {}, c = commitOf(p), g = p.github_info || {};
  const row = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : '';
  return `<dl class="detgrid">
    ${row('Description', I.description !== I.claude_summary ? esc(I.description) : '')}
    ${row('Goal', esc(I.goal))}
    ${row('CLAUDE.md', (I.claude_summary ? esc(I.claude_summary) + '<br>' : '') + claudeFlag(p.info))}
    ${row('Sections', (I.claude_sections || []).length ? `<div class="chips">${I.claude_sections.map((x) => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : '')}
    ${row('README', esc(I.readme_summary))}
    ${row('Status', `<span class="colpill" style="--c:${COLMAP[p.column].c}">${COLMAP[p.column].label}</span> ${(p.reasons || []).map((r) => esc(r)).join(' · ')}`)}
    ${row('Last commit', c ? `${c.url ? `<a href="${esc(safeUrl(c.url) || '#')}" target="_blank" rel="noopener">${esc(c.sha)}</a>` : esc(c.sha)} ${esc(c.msg)} · ${esc(ago(c.at))}${I.branch ? ` · local branch <code>${esc(I.branch)}</code>` : ''}` : '')}
    ${row('Open PRs', (g.prs || []).map((x) => `<a href="${esc(safeUrl(x.url) || '#')}" target="_blank" rel="noopener">#${esc(x.n)}</a> ${esc(x.title)}`).join('<br>'))}
    ${row('Deploy', p.deploy ? `${esc((p.deploy.state || '').toLowerCase())} · ${esc(ago(p.deploy.at))}` : '')}
    ${row('Note', p.note ? `<b>${esc(p.note.bot)}</b> ${esc(ago(p.note.at))}: ${esc(p.note.text)}` : '')}
    ${row('Copy of', p.variant_of ? esc(p.variant_of) + (p.registry_note ? ' · ' + esc(p.registry_note) : '') : '')}
    ${row('Folder', p.local ? `<code>${esc(MAC_ROOT + p.local)}</code>` : '')}
    ${row('Links', `<div class="links" style="margin:0">${linksFor(p)}</div>`)}
  </dl>`;
}
function sortVal(p, k) {
  const I = p.info || {};
  if (k === 'name') return p.name.toLowerCase();
  if (k === 'bucket') return (I.bucket || 'zz') + p.name.toLowerCase();
  if (k === 'status') return COLMAP[p.column].i;
  if (k === 'desc') return (I.description || '~').toLowerCase();
  if (k === 'stack') return (I.stack || []).join(',') || '~';
  if (k === 'claude') return !I.bucket ? 3 : !I.has_claude ? 0 : I.claude_stale ? 1 : 2;
  if (k === 'commit') { const c = commitOf(p); return c ? new Date(c.at).getTime() : 0; }
  return '';
}
function renderList() {
  const q = $('#q').value.trim().toLowerCase();
  const fb = $('#fBucket').value, fs = $('#fStatus').value, fk = $('#fStack').value, fc = $('#fNoClaude').checked, hc = $('#fHideCopies').checked;
  let list = DATA.projects.filter((p) => {
    const I = p.info || {};
    if (fb && (I.bucket || 'other') !== fb) return false;
    if (fs && p.column !== fs) return false;
    if (fk && !(I.stack || []).includes(fk)) return false;
    if (fc && !(I.bucket && (!I.has_claude || I.claude_stale))) return false;
    if (hc && p.variant_of) return false;
    return !q || JSON.stringify([p.name, p.slug, p.github, p.local, I.description, I.goal, I.claude_summary, I.readme_summary, I.stack, p.reasons]).toLowerCase().includes(q);
  });
  const dir = SORT.dir === 'asc' ? 1 : -1;
  list.sort((a, b) => { const x = sortVal(a, SORT.k), y = sortVal(b, SORT.k); return (x < y ? -1 : x > y ? 1 : 0) * dir || a.name.localeCompare(b.name); });
  $('#lcount').textContent = `${list.length} of ${DATA.projects.length}`;
  document.querySelectorAll('.ltable th[data-k]').forEach((th) => th.dataset.dir = th.dataset.k === SORT.k ? SORT.dir : '');
  $('#ltbody').innerHTML = list.map((p) => {
    const I = p.info || {}, c = commitOf(p), C = COLMAP[p.column];
    return `<tr class="lrow" data-slug="${esc(p.slug)}" tabindex="0" style="--pc:${esc(p.color || '#94928f')}">
      <td><div class="lname"><div class="ico" aria-hidden="true">${esc(p.icon || '•')}</div><div><div class="name">${esc(p.name)}</div><div class="sub">${p.variant_of ? 'copy of ' + esc(p.variant_of) : esc(p.slug)}${p.paused ? ' · paused' : ''}</div></div></div></td>
      <td>${esc(BUCKETS[I.bucket] || (I.bucket ? I.bucket : 'box/other'))}</td>
      <td><span class="colpill" style="--c:${C.c}">${C.label}</span></td>
      <td><div class="ldesc" title="${esc(I.description || '')}">${esc(I.description || '') || '<span class="muted">—</span>'}</div></td>
      <td><div class="chips">${(I.stack || []).map((x) => `<span class="chip">${esc(x)}</span>`).join('')}</div></td>
      <td>${claudeFlag(p.info)}</td>
      <td style="white-space:nowrap">${c ? `${esc(ago(c.at))}<div class="sub">${esc(c.sha)}</div>` : '<span class="muted">—</span>'}</td>
      <td><div class="links" style="margin:0">${linksFor(p)}</div></td></tr>
      ${OPEN.has(p.slug) ? `<tr class="ldet"><td colspan="8">${details(p)}</td></tr>` : ''}`;
  }).join('') || '<tr><td colspan="8" class="muted">No projects match.</td></tr>';
  $('#lcards').innerHTML = list.map((p) => {
    const I = p.info || {}, c = commitOf(p), C = COLMAP[p.column];
    return `<article class="card lcard" style="--pc:${esc(p.color || '#94928f')}">
      <div class="ch" data-toggle="${esc(p.slug)}" style="cursor:pointer"><div class="ico" aria-hidden="true">${esc(p.icon || '•')}</div>
        <div style="flex:1;min-width:0"><div class="name">${esc(p.name)}</div><div class="sub">${esc(BUCKETS[I.bucket] || 'box/other')} · ${c ? 'commit ' + esc(ago(c.at)) : 'no commits'}</div></div>
        <span class="colpill" style="--c:${C.c}">${C.label}</span></div>
      ${I.description ? `<div class="commit">${esc(I.description)}</div>` : ''}
      <div class="reasons"><div class="chips">${(I.stack || []).map((x) => `<span class="chip">${esc(x)}</span>`).join('')}</div> ${claudeFlag(p.info)}</div>
      ${OPEN.has(p.slug) ? `<div style="margin-top:8px">${details(p)}</div>` : `<div class="links">${linksFor(p)}<button type="button" data-toggle="${esc(p.slug)}">More ▾</button></div>`}
    </article>`;
  }).join('') || '<p class="muted">No projects match.</p>';
}
function setView(v) {
  VIEW = v; localStorage.setItem('projView', v);
  $('#vBoard').classList.toggle('on', v === 'board'); $('#vList').classList.toggle('on', v === 'list');
  $('#boardWrap').hidden = v !== 'board'; $('#listWrap').hidden = v !== 'list';
  $('#tabs').style.visibility = v === 'board' ? '' : 'hidden'; $('#tabs').style.height = v === 'board' ? '' : '0';
  $('#hideQuiet').hidden = v !== 'board';
  render();
}
function fillFilters() {
  const b = new Set(), k = new Set();
  DATA.projects.forEach((p) => { if (p.info) { b.add(p.info.bucket); (p.info.stack || []).forEach((x) => k.add(x)); } });
  const keep = (id, opts, lab) => { const el = $(id), cur = el.value; el.innerHTML = `<option value="">${lab}</option>` + opts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join(''); el.value = cur; };
  keep('#fBucket', [...b].sort().map((x) => [x, BUCKETS[x] || x]).concat([['other', 'Box / other']]), 'All buckets');
  keep('#fStack', [...k].sort().map((x) => [x, x]), 'Any stack');
}
document.addEventListener('click', (e) => {
  const th = e.target.closest('.ltable th[data-k]');
  if (th) { SORT = { k: th.dataset.k, dir: SORT.k === th.dataset.k && SORT.dir === 'asc' ? 'desc' : (th.dataset.k === 'commit' ? 'desc' : 'asc') }; $('#fSort').value = ['name','commit','status','bucket'].includes(SORT.k) ? SORT.k : $('#fSort').value; return renderList(); }
  if (e.target.closest('a, button[data-copy]')) return;
  const t = e.target.closest('[data-toggle], tr.lrow'); if (!t) return;
  const slug = t.dataset.toggle || t.dataset.slug;
  OPEN.has(slug) ? OPEN.delete(slug) : OPEN.add(slug); renderList();
});
['#fBucket', '#fStatus', '#fStack', '#fNoClaude', '#fHideCopies'].forEach((id) => $(id).addEventListener('change', () => renderList()));
$('#fSort').addEventListener('change', (e) => { SORT = { k: e.target.value, dir: e.target.value === 'commit' ? 'desc' : 'asc' }; renderList(); });
$('#vBoard').addEventListener('click', () => setView('board'));
$('#vList').addEventListener('click', () => setView('list'));
load(); setInterval(load, 5 * 60 * 1000);
</script>
</body>
