<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Ostroff.LA</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body class="login">
  <svg class="wave" viewBox="0 0 1200 220" preserveAspectRatio="none" fill="none" aria-hidden="true">
    <path d="M0 160 C 200 120, 380 200, 600 150 S 1000 90, 1200 140" stroke="#497d7e" stroke-opacity=".5" stroke-width="1.5"/>
    <path d="M0 185 C 240 140, 420 215, 640 175 S 1020 120, 1200 170" stroke="#4c7a45" stroke-opacity=".45" stroke-width="1.5"/>
    <path d="M0 205 C 260 170, 460 235, 700 195 S 1040 150, 1200 195" stroke="#e34432" stroke-opacity=".4" stroke-width="1.5"/>
  </svg>

  <div class="card auth">
    <div class="mark">
      <span class="sq"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 7.5l3 3 7-7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Ostroff.la
    </div>
    <p data-lead>Private pages. Sign in with your admin account.</p>

    <form method="post" action="/api/login" class="stack" data-login>
      <input type="hidden" name="next" value="/today/" data-next />
      <input class="input" type="text" name="username" autocomplete="username" placeholder="Username" aria-label="Username" autofocus required />
      <input class="input" type="password" name="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required />
      <button type="submit" class="btn primary">Sign in</button>
    </form>
    <p class="err" data-err hidden>That username or password didn’t match.</p>
    <p class="err" data-locked hidden>Sign-in is locked until ADMIN_SESSION_SECRET is set.</p>

    <form class="stack" data-create hidden>
      <input class="input" type="text" name="username" autocomplete="username" placeholder="Username" aria-label="New username" required />
      <input class="input" type="password" name="password" autocomplete="new-password" placeholder="Password (8+ characters)" aria-label="New password" required minlength="8" />
      <input class="input" type="password" name="setup" autocomplete="off" placeholder="Setup code" aria-label="Setup code" data-setup />
      <button type="submit" class="btn">Create admin</button>
    </form>
    <p class="err" data-create-err hidden></p>
    <p class="fine" data-create-ok hidden></p>

    <div data-signed-in hidden>
      <nav class="nav-list" aria-label="Portal">
        <a href="/today/">Today</a>
        <a href="/approvals/">Approvals</a>
        <a href="/mail/">Mail log</a>
        <a href="/projects/">Projects</a>
        <a href="/tickets/">Tickets</a>
        <a href="/trips/">Trips</a>
      </nav>
      <div class="stack">
        <a class="btn primary" href="/today/">Open portal</a>
        <form method="post" action="/api/logout"><button type="submit" class="btn" style="width:100%">Sign out</button></form>
      </div>
    </div>

    <p class="fine"><a href="/">← Back to ostroff.la</a></p>
  </div>

  <script>
    const q = new URLSearchParams(location.search);
    const next = q.get('next') || '';
    if (/^\/(today|approvals|mail|projects|tickets|trips)(\/|$)/.test(next)) document.querySelector('[data-next]').value = next;
    if (q.get('err') === '1') document.querySelector('[data-err]').hidden = false;
    if (q.get('err') === 'locked') document.querySelector('[data-locked]').hidden = false;

    const login = document.querySelector('[data-login]');
    const create = document.querySelector('[data-create]');
    const lead = document.querySelector('[data-lead]');
    const signed = document.querySelector('[data-signed-in]');
    const createErr = document.querySelector('[data-create-err]');
    const createOk = document.querySelector('[data-create-ok]');
    const setup = document.querySelector('[data-setup]');
    let me = null;

    (async () => {
      try {
        const r = await fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' });
        if (r.ok) me = await r.json();
      } catch {}

      let empty = false;
      try {
        const r = await fetch('/api/users', { credentials: 'same-origin', cache: 'no-store' });
        const body = await r.json().catch(() => ({}));
        empty = Boolean(body.empty) || (r.ok && !(body.users || []).length);
      } catch {}

      if (me && me.username) {
        login.hidden = true;
        signed.hidden = false;
        create.hidden = false;
        setup.hidden = true;
        setup.required = false;
        lead.textContent = `Signed in as ${me.username}. Open the portal, or add another admin below.`;
        return;
      }

      if (empty) {
        create.hidden = false;
        setup.hidden = false;
        setup.required = true;
        lead.textContent = 'Create the first admin. The setup code is the existing Morning password (or ADMIN_SETUP_TOKEN).';
      } else {
        create.hidden = true;
        setup.required = false;
        lead.textContent = 'Private pages. Sign in with your admin account.';
      }
    })();

    create.addEventListener('submit', async (e) => {
      e.preventDefault();
      createErr.hidden = true;
      createOk.hidden = true;
      const data = Object.fromEntries(new FormData(create).entries());
      const res = await fetch('/api/users', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(data),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        createErr.textContent = body.error || 'Could not create that user.';
        createErr.hidden = false;
        return;
      }
      if (body.persisted === 'file') {
        createOk.textContent = `Created ${body.user.username}. Saved locally.`;
      } else {
        createOk.textContent = `Created ${body.user.username}. To keep this account on Vercel, set ADMIN_USERS_JSON to the value copied to your clipboard.`;
        if (body.envSnippet) navigator.clipboard?.writeText(body.envSnippet).catch(() => {});
      }
      createOk.hidden = false;
      create.reset();
      if (!me) location.assign(document.querySelector('[data-next]').value || '/today/');
    });
  </script>
</body>
</html>
