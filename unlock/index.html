<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Ostroff.LA</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="refresh" content="0;url=/login/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <p><a href="/login/">Continue to admin sign in</a></p>
  <script>
    const q = new URLSearchParams(location.search);
    const next = q.get('next') || '';
    const to = new URL('/login/', location.origin);
    if (/^\/(trips|tickets|bots|morning)(\/|$)/.test(next)) to.searchParams.set('next', next);
    location.replace(to.pathname + to.search);
  </script>
</body>
</html>
